
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F6F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tafel">
<title>Tafel · Boodschappen</title>
<link rel="icon" href="./icons/icon.svg">

<style>
:root {
  color-scheme: light;
  --bg: #F8F6F1;
  --surface: #FFFEFA;
  --text: #293B40;
  --muted: #79877F;
  --accent: #476E62;
  --accent-light: #E9EFE8;
  --peach: #E8B59E;
  --peach-light: #FAEEE7;
  --border: #E3E8DF;
  --danger: #C76B63;
  --shadow: 0 5px 24px rgba(55,77,65,.055);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse 130% 300px at 50% 0%,
      #E6EEE3 0%, #F3F5ED 62%, transparent 100%)
    no-repeat, var(--bg);
  color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont,
    "Segoe UI", system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid #9EC4B0;
  outline-offset: 2px;
}
button:disabled { opacity: .45; cursor: default; }
.app {
  max-width: 720px;
  min-height: 100dvh;
  margin: auto;
  padding: max(20px, env(safe-area-inset-top)) 20px
    calc(132px + env(safe-area-inset-bottom));
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 48px;
  margin-bottom: 36px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -.6px;
  color: #34594E;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--accent);
  color: white;
  font-size: 21px;
  box-shadow: 0 4px 12px #476E6230;
}
.icon-btn {
  width: 44px;
  height: 44px;
  border: 1px solid #DCE7DE;
  border-radius: 14px;
  background: #FFFFFFAA;
  color: var(--accent);
  font-size: 20px;
}
.heading h1 {
  margin: 0;
  font-size: clamp(30px, 6vw, 39px);
  font-weight: 800;
  letter-spacing: -1.6px;
  line-height: 1.12;
}
.subtitle {
  margin: 10px 0 26px;
  color: var(--muted);
  font-size: 14px;
}
.filters {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  margin: 0 -20px 23px;
  padding: 2px 20px 10px;
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.filter {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 10px 16px;
  white-space: nowrap;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: #FFFEFADD;
  color: #60776B;
  font-size: 13px;
  font-weight: 650;
}
.filter.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  box-shadow: 0 4px 11px #476E6228;
}
.filter.add-store {
  background: var(--peach-light);
  border-color: #EED3C5;
  color: #895D49;
}
.filter:active, .icon-btn:active {
  transform: scale(.97);
}
.section-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 2px 12px;
  color: #60786A;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.count {
  color: #82958A;
  font-size: 12px;
  letter-spacing: 0;
  font-weight: 600;
}
.list {
  overflow: hidden;
  border: 1px solid #E8E9DF;
  border-radius: 22px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.item {
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 70px;
  padding: 8px 13px 8px 10px;
}
.item + .item {
  border-top: 1px solid #F0F0E9;
}
.check-area {
  flex: 0 0 48px;
  width: 48px;
  height: 48px;
  border: 0;
  background: transparent;
  display: grid;
  place-items: center;
  padding: 0;
}
.check {
  display: grid;
  place-items: center;
  width: 27px;
  height: 27px;
  border: 2px solid #A8BDAC;
  border-radius: 50%;
  background: var(--surface);
  transition: background .16s, border-color .16s, transform .16s;
}
.check::after {
  content: "";
  width: 12px;
  height: 7px;
  border-left: 2px solid white;
  border-bottom: 2px solid white;
  transform: rotate(-45deg) translate(1px,-1px);
  opacity: 0;
}
.item.done .check {
  background: #628778;
  border-color: #628778;
}
.item.done .check::after { opacity: 1; }
.check-area:active .check { transform: scale(.88); }
.item-content {
  flex: 1;
  min-width: 0;
  padding: 8px 0;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
}
.item-title {
  display: block;
  overflow-wrap: anywhere;
  font-weight: 600;
  font-size: 15px;
  color: #344940;
}
.item-note {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}
.item.done { background: #F8FAF5; }
.item.done .item-title {
  color: #98A99E;
  text-decoration: line-through;
}
.item-arrow {
  font-size: 22px;
  color: #A2B2A4;
}
.completed {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  margin: 28px 0 10px;
  padding: 12px 2px;
  background: transparent;
  border: 0;
  color: #60786A;
  font-size: 14px;
  font-weight: 700;
  text-align: left;
}
.chevron {
  display: inline-block;
  transition: transform .18s;
}
.completed[aria-expanded="true"] .chevron {
  transform: rotate(90deg);
}
.completed-list[hidden] { display: none; }
.empty {
  padding: 51px 24px;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}
.empty-symbol {
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  margin: 0 auto 13px;
  border-radius: 20px;
  background: var(--accent-light);
  color: var(--accent);
  font-size: 27px;
}
.empty strong {
  display: block;
  margin-bottom: 4px;
  color: #3F6254;
  font-size: 16px;
}
.empty p { margin: 0; }

/* Invoerbalk */
.composer-wrap {
  position: fixed;
  z-index: 5;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 18px 16px calc(17px + env(safe-area-inset-bottom));
  background: linear-gradient(
    transparent, #F8F6F1F0 27%, #F8F6F1 75%
  );
}
.composer {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 680px;
  margin: auto;
  padding: 8px 8px 8px 17px;
  border: 1px solid #DDE5DC;
  border-radius: 21px;
  background: var(--surface);
  box-shadow: 0 8px 32px #304D6119;
}
.composer-plus {
  font-size: 26px;
  color: var(--accent);
}
.composer input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 16px;
}
.composer input::placeholder { color: #9BA99D; }
.add-btn {
  flex: 0 0 46px;
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 15px;
  background: var(--accent);
  color: white;
  font-size: 24px;
}
.add-btn:active { transform: scale(.94); }

/* Dialogen */
dialog {
  width: min(440px, calc(100% - 28px));
  max-height: calc(100dvh - 32px);
  overflow: auto;
  padding: 24px;
  border: 0;
  border-radius: 25px;
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 22px 80px #16292244;
}
dialog::backdrop {
  background: #1D2D276B;
  backdrop-filter: blur(4px);
}
dialog h2 {
  margin: 0 0 21px;
  font-size: 21px;
  letter-spacing: -.4px;
}
.field {
  display: block;
  margin-bottom: 15px;
}
.field > span {
  display: block;
  margin-bottom: 7px;
  color: #688073;
  font-size: 12px;
  font-weight: 750;
}
.field input, .field select {
  width: 100%;
  min-height: 47px;
  padding: 10px 12px;
  border: 1px solid #DFE7DC;
  border-radius: 12px;
  background: #FAFBF7;
  color: var(--text);
  font-size: 16px;
}
.store-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.store-row select {
  flex: 1;
  min-width: 0;
}
.tiny-add {
  flex: 0 0 47px;
  width: 47px;
  min-height: 47px;
  border: 1px solid #EED3C5;
  border-radius: 12px;
  background: var(--peach-light);
  color: #895D49;
  font-size: 24px;
}
.dialog-actions {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 23px;
}
.btn {
  min-height: 45px;
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #F7F8F3;
  color: #3B5549;
  font-weight: 650;
}
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.btn.danger {
  background: var(--peach-light);
  border-color: #F2DBD0;
  color: var(--danger);
}
.menu-actions {
  display: grid;
  gap: 9px;
}
.menu-actions .btn { text-align: left; }
.hint {
  margin: -8px 0 17px;
  color: var(--muted);
  font-size: 13px;
}
.error {
  min-height: 17px;
  margin: 8px 0 0;
  color: var(--danger);
  font-size: 13px;
}
.toast {
  position: fixed;
  z-index: 20;
  left: 50%;
  bottom: calc(106px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  max-width: calc(100vw - 32px);
  padding: 12px 18px;
  border-radius: 15px;
  background: #314B41;
  color: white;
  font-size: 13px;
  text-align: center;
  box-shadow: 0 8px 27px #152A2133;
}
.toast[hidden] { display: none; }

@media(min-width:740px) {
  .app { padding-top: 35px; }
  .composer-wrap { padding-bottom: 25px; }
}
@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
  }
}

/* Dark mode */
@media(prefers-color-scheme:dark) {
  :root {
    color-scheme: dark;
    --bg: #171F1C;
    --surface: #25302B;
    --text: #EDF2EC;
    --muted: #A5B7AB;
    --accent: #9DC5A7;
    --accent-light: #31463A;
    --border: #3A4A3F;
    --danger: #E9A198;
    --shadow: none;
  }
  body {
    background: radial-gradient(
      ellipse 130% 300px at 50% 0%,
      #273D30, transparent 100%
    ) no-repeat, var(--bg);
  }
  .brand, .heading h1, .item-title,
  .empty strong { color: #EDF2EC; }
  .brand-mark { background: #749D83; color: #152219; }
  .icon-btn {
    background: #2B3B31;
    border-color: #3B5142;
    color: #C3D8C8;
  }
  .section-label, .completed { color: #A8C4AE; }
  .filter {
    background: #26342C;
    border-color: #3B5142;
    color: #C2D0C4;
  }
  .filter.active {
    background: #749D83;
    border-color: #749D83;
    color: #152219;
  }
  .filter.add-store, .tiny-add {
    background: #49382F;
    border-color: #715344;
    color: #F2CBB8;
  }
  .list {
    background: var(--surface);
    border-color: #39463D;
  }
  .item + .item { border-color: #344138; }
  .item.done { background: #222D26; }
  .item.done .item-title { color: #84998A; }
  .check { background: transparent; border-color: #8CAB96; }
  .item.done .check {
    background: #89B297;
    border-color: #89B297;
  }
  .item.done .check::after { border-color: #152219; }
  .composer-wrap {
    background: linear-gradient(
      transparent, #171F1CEF 27%, #171F1C 75%
    );
  }
  .composer {
    background: #25342A;
    border-color: #415443;
  }
  .composer input { color: #EDF2EC; }
  .add-btn, .btn.primary {
    background: #89B297;
    border-color: #89B297;
    color: #152219;
  }
  .field input, .field select {
    background: #1B261F;
    border-color: #405044;
    color: #EDF2EC;
  }
  .btn {
    background: #344238;
    border-color: #465749;
    color: #E2ECE4;
  }
  .btn.danger {
    background: #49332F;
    border-color: #64443D;
    color: #F1AFA5;
  }
  .empty-symbol { background: #344B3C; color: #A8D1B2; }
  .toast { background: #4B6A56; }
}
</style>
</head>

<body>

<main class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✓</span>
      Tafel
    </div>
    <button class="icon-btn" id="menuButton"
            aria-label="Meer opties">•••</button>
  </header>

  <section class="heading">
    <h1>Boodschappen</h1>
    <p class="subtitle" id="subtitle">Je lijst wordt geladen...</p>
  </section>

  <nav class="filters" id="filters" aria-label="Winkels"></nav>

  <section aria-label="Nog te kopen">
    <div class="section-label">
      <span>Nog te kopen</span>
      <span class="count" id="activeCount"></span>
    </div>
    <div class="list" id="activeList"></div>
  </section>

  <section>
    <button class="completed" id="completedToggle"
            aria-expanded="false" aria-controls="completedList">
      <span class="chevron">›</span>
      <span id="completedLabel">Afgevinkt</span>
    </button>
    <div class="list completed-list" id="completedList" hidden></div>
  </section>
</main>

<div class="composer-wrap">
  <form class="composer" id="addForm">
    <span class="composer-plus" aria-hidden="true">+</span>
    <input id="newItem" type="text" maxlength="200"
           autocomplete="off" enterkeyhint="done"
           placeholder="Voeg een product toe..."
           aria-label="Nieuw product">
    <button class="add-btn" type="submit"
            aria-label="Toevoegen">↑</button>
  </form>
</div>

<!-- Product bewerken -->
<dialog id="editDialog">
  <form id="editForm">
    <h2>Product aanpassen</h2>
    <input type="hidden" id="editId">

    <label class="field">
      <span>Product</span>
      <input id="editName" required maxlength="200">
    </label>

    <label class="field">
      <span>Hoeveelheid</span>
      <input id="editQuantity" type="number"
             min="0.01" step="any" required>
    </label>

    <label class="field">
      <span>Eenheid</span>
      <select id="editUnit">
        <option value="pcs">Stuks</option>
        <option value="g">Gram</option>
        <option value="kg">Kilogram</option>
        <option value="ml">Milliliter</option>
        <option value="l">Liter</option>
        <option value="tbsp">Eetlepel</option>
        <option value="tsp">Theelepel</option>
      </select>
    </label>

    <label class="field">
      <span>Winkel</span>
      <div class="store-row">
        <select id="editStore"></select>
        <button class="tiny-add" id="addStoreFromEdit"
                type="button" aria-label="Nieuwe winkel toevoegen"
                title="Nieuwe winkel toevoegen">+</button>
      </div>
    </label>

    <label class="field">
      <span>Notitie (optioneel)</span>
      <input id="editNote" maxlength="500">
    </label>

    <div class="dialog-actions">
      <button class="btn danger" id="deleteItem"
              type="button">Verwijder</button>
      <button class="btn" id="cancelEdit"
              type="button">Annuleer</button>
      <button class="btn primary" type="submit">Bewaren</button>
    </div>
  </form>
</dialog>

<!-- Winkel toevoegen -->
<dialog id="storeDialog">
  <form id="storeForm">
    <h2>Nieuwe winkel</h2>
    <p class="hint">
      Voeg een winkel toe. Je vindt hem daarna altijd
      terug tussen je winkels.
    </p>

    <label class="field">
      <span>Naam van de winkel</span>
      <input id="storeName" required maxlength="80"
             placeholder="Bijv. Action, Kruidvat, Okay"
             autocomplete="off">
    </label>

    <p class="error" id="storeError" role="alert"></p>

    <div class="dialog-actions">
      <button class="btn" id="cancelStore"
              type="button">Annuleer</button>
      <button class="btn primary" type="submit">
        Winkel toevoegen
      </button>
    </div>
  </form>
</dialog>

<!-- Opties -->
<dialog id="menuDialog">
  <h2>Meer opties</h2>
  <div class="menu-actions">
    <button class="btn" id="menuAddStore">
      + Nieuwe winkel toevoegen
    </button>
    <button class="btn" id="shareButton">
      Deel boodschappenlijst
    </button>
    <button class="btn" id="exportButton">
      Exporteer back-up
    </button>
    <button class="btn danger" id="clearCompleted">
      Wis afgevinkte producten
    </button>
    <button class="btn" id="closeMenu">Sluiten</button>
  </div>
</dialog>

<div id="toast" class="toast"
     role="status" aria-live="polite" hidden></div>

<script>
"use strict";

/* Database: compatible met de vorige Tafel-versie */
const DB_NAME = "mealplan";
const DB_VERSION = 1;
const STORES = {
  stores: "id",
  ingredients: "id",
  recipes: "id",
  plan: "key",
  shopping: "id",
  pantry: "id",
  meta: "id"
};

const $ = id => document.getElementById(id);

const model = {
  items: [],
  stores: [],
  ingredients: [],
  filter: "all",
  completedOpen: false
};

const unitLabels = {
  pcs: "stuks",
  g: "g",
  kg: "kg",
  ml: "ml",
  l: "l",
  tbsp: "el",
  tsp: "tl"
};

function makeId() {
  return crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now().toString(36) +
      Math.random().toString(36).slice(2);
}

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

/* IndexedDB */
const dbPromise = new Promise((resolve, reject) => {
  const request = indexedDB.open(DB_NAME, DB_VERSION);

  request.onupgradeneeded = () => {
    const db = request.result;
    for (const [name, keyPath] of Object.entries(STORES)) {
      if (!db.objectStoreNames.contains(name)) {
        db.createObjectStore(name, { keyPath });
      }
    }
  };

  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});

async function transaction(store, mode, operation) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const request = operation(tx.objectStore(store));

    tx.oncomplete = () => resolve(request?.result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

const getAll = store =>
  transaction(store, "readonly", s => s.getAll());

const put = (store, value) =>
  transaction(store, "readwrite", s => s.put(value));

const del = (store, id) =>
  transaction(store, "readwrite", s => s.delete(id));

async function load() {
  const [items, stores, ingredients] = await Promise.all([
    getAll("shopping"),
    getAll("stores"),
    getAll("ingredients")
  ]);

  model.items = items;
  model.stores = stores.sort(
    (a, b) => (a.order ?? 0) - (b.order ?? 0)
  );
  model.ingredients = ingredients;

  render();
}

/* Rendering */
function filtered() {
  return model.items.filter(i =>
    model.filter === "all" ||
    (
      model.filter === "none"
        ? (!i.storeId ||
           !model.stores.some(s => s.id === i.storeId))
        : i.storeId === model.filter
    )
  );
}

function details(i) {
  const parts = [];
  const q = Number(i.quantity);

  if (Number.isFinite(q) && q > 0 &&
      (q !== 1 || (i.unit && i.unit !== "pcs"))) {
    parts.push(
      `${q.toLocaleString("nl-BE")} ${unitLabels[i.unit] || i.unit}`
    );
  }

  const store = model.stores.find(s => s.id === i.storeId);
  if (store) parts.push(store.name);
  if (i.note) parts.push(i.note);

  return parts.join(" · ");
}

function itemHTML(item) {
  const name = esc(item.name);
  const note = details(item);

  return `
    <div class="item ${item.checked ? "done" : ""}"
         data-id="${esc(item.id)}">

      <button class="check-area" data-action="toggle"
              role="checkbox"
              aria-checked="${!!item.checked}"
              aria-label="${item.checked ? "Opnieuw toevoegen" : "Afvinken"}: ${name}">
        <span class="check" aria-hidden="true"></span>
      </button>

      <button class="item-content" data-action="edit"
              aria-label="Bewerk ${name}">
        <span class="item-title">${name}</span>
        ${note ? `<span class="item-note">${esc(note)}</span>` : ""}
      </button>

      <span class="item-arrow" aria-hidden="true">›</span>
    </div>
  `;
}

function renderFilters() {
  const options = [
    { id: "all", name: "Alles" },
    ...model.stores.map(s => ({
      id: s.id,
      name: s.name
    })),
    { id: "none", name: "Andere" }
  ];

  $("filters").innerHTML =
    options.map(option => `
      <button class="filter ${model.filter === option.id ? "active" : ""}"
              data-filter="${esc(option.id)}"
              aria-pressed="${model.filter === option.id}">
        ${esc(option.name)}
      </button>
    `).join("") +
    `<button class="filter add-store" id="filterAddStore"
             type="button">+ Nieuwe winkel</button>`;
}

function render() {
  renderFilters();

  const items = filtered();

  const active = items
    .filter(i => !i.checked)
    .sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));

  const completed = items.filter(i => i.checked);

  $("activeCount").textContent =
    `${active.length} producten`;

  $("subtitle").textContent = active.length
    ? `${active.length} ${active.length === 1 ? "product" : "producten"} nog te kopen`
    : "Je bent helemaal klaar!";

  $("activeList").innerHTML = active.length
    ? active.map(itemHTML).join("")
    : `
      <div class="empty">
        <span class="empty-symbol">✓</span>
        <strong>Alles afgevinkt!</strong>
        <p>Voeg hieronder iets toe aan je lijst.</p>
      </div>`;

  $("completedLabel").textContent =
    `Afgevinkt (${completed.length})`;

  $("completedToggle").setAttribute(
    "aria-expanded", String(model.completedOpen)
  );

  $("completedList").hidden = !model.completedOpen;

  $("completedList").innerHTML = completed.length
    ? completed.map(itemHTML).join("")
    : `<div class="empty">Nog niets afgevinkt.</div>`;
}

/* Meldingen */
let toastTimer;

function toast(message) {
  const element = $("toast");
  element.textContent = message;
  element.hidden = false;

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    element.hidden = true;
  }, 2600);
}

/* Producten toevoegen */
async function addItem(value) {
  const raw = value.trim();
  if (!raw) return;

  const match = raw.match(
    /^(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l|stuks|pcs|el|tl)?\s+(.+)$/i
  );

  let name = raw;
  let quantity = 1;
  let unit = "pcs";

  if (match) {
    quantity = Number(match[1].replace(",", "."));
    unit = ({
      stuks: "pcs",
      el: "tbsp",
      tl: "tsp"
    })[match[2]?.toLowerCase()] ||
      match[2]?.toLowerCase() ||
      "pcs";

    name = match[3].trim();
  }

  if (!name || !Number.isFinite(quantity) || quantity <= 0) {
    throw Error("Ongeldig product");
  }

  let ingredient = model.ingredients.find(i =>
    i.name.toLocaleLowerCase("nl-BE") ===
    name.toLocaleLowerCase("nl-BE")
  );

  if (!ingredient) {
    ingredient = {
      id: makeId(),
      name,
      category: "other",
      preferredStoreId: null,
      alternativeStoreIds: [],
      price: null,
      priceUnit: null,
      notes: ""
    };

    await put("ingredients", ingredient);
    model.ingredients.push(ingredient);
  }

  const item = {
    id: makeId(),
    ingredientId: ingredient.id,
    name,
    quantity,
    unit,
    storeId: !["all", "none"].includes(model.filter)
      ? model.filter
      : (ingredient.preferredStoreId || null),
    category: ingredient.category || "other",
    note: "",
    checked: false,
    source: "manual",
    addedAt: Date.now()
  };

  await put("shopping", item);
  model.items.push(item);
  render();
}

async function toggle(id) {
  const item = model.items.find(i => i.id === id);
  if (!item) return;

  const updated = {
    ...item,
    checked: !item.checked
  };

  await put("shopping", updated);

  model.items = model.items.map(i =>
    i.id === id ? updated : i
  );

  render();
}

/* Product bewerken */
function populateStoreSelect(selected) {
  $("editStore").innerHTML =
    `<option value="">Geen specifieke winkel</option>` +
    model.stores.map(store => `
      <option value="${esc(store.id)}">
        ${esc(store.name)}
      </option>
    `).join("");

  $("editStore").value = selected || "";
}

function edit(id) {
  const item = model.items.find(i => i.id === id);
  if (!item) return;

  $("editId").value = item.id;
  $("editName").value = item.name;
  $("editQuantity").value = item.quantity || 1;
  $("editNote").value = item.note || "";

  if (item.unit &&
      ![...$("editUnit").options].some(o => o.value === item.unit)) {
    $("editUnit").add(new Option(item.unit, item.unit));
  }

  $("editUnit").value = item.unit || "pcs";
  populateStoreSelect(item.storeId);

  $("editDialog").showModal();
}

async function saveEdit(event) {
  event.preventDefault();

  const id = $("editId").value;
  const item = model.items.find(i => i.id === id);
  if (!item) return;

  const name = $("editName").value.trim();
  const quantity = Number($("editQuantity").value);

  if (!name || !Number.isFinite(quantity) || quantity <= 0) {
    return;
  }

  const updated = {
    ...item,
    name,
    quantity,
    unit: $("editUnit").value,
    storeId: $("editStore").value || null,
    note: $("editNote").value.trim()
  };

  await put("shopping", updated);

  model.items = model.items.map(i =>
    i.id === id ? updated : i
  );

  $("editDialog").close();
  render();
  toast("Wijzigingen bewaard");
}

async function deleteItem() {
  const id = $("editId").value;

  await del("shopping", id);

  model.items = model.items.filter(i => i.id !== id);

  $("editDialog").close();
  render();
  toast("Product verwijderd");
}

/* Nieuwe winkels aanmaken */
let storeOrigin = "filter";

function showStoreDialog(origin = "filter") {
  storeOrigin = origin;
  $("storeError").textContent = "";
  $("storeName").value = "";

  if (origin === "edit") {
    $("editDialog").close();
  }

  if (origin === "menu") {
    $("menuDialog").close();
  }

  $("storeDialog").showModal();
}

function closeStoreDialog() {
  $("storeDialog").close();

  if (storeOrigin === "edit") {
    $("editDialog").showModal();
  }
}

async function createStore(event) {
  event.preventDefault();

  const name = $("storeName").value.trim().replace(/\s+/g, " ");

  if (!name) {
    $("storeError").textContent = "Vul een winkelnaam in.";
    return;
  }

  const existing = model.stores.find(store =>
    store.name.toLocaleLowerCase("nl-BE") ===
    name.toLocaleLowerCase("nl-BE")
  );

  if (existing) {
    $("storeError").textContent = "Deze winkel bestaat al.";
    return;
  }

  const store = {
    id: makeId(),
    name,
    color: "#628778",
    order: model.stores.reduce(
      (max, store) => Math.max(max, store.order ?? 0),
      -1
    ) + 1
  };

  try {
    await put("stores", store);
    model.stores.push(store);

    const origin = storeOrigin;
    $("storeDialog").close();

    if (origin === "edit") {
      populateStoreSelect(store.id);
      $("editDialog").showModal();
    } else {
      model.filter = store.id;
    }

    render();
    toast(`${name} toegevoegd`);
  } catch (error) {
    console.error(error);
    $("storeError").textContent = "Winkel opslaan mislukt.";
  }
}

/* Voltooide items wissen */
async function clearCompleted() {
  const completed = model.items.filter(i => i.checked);

  if (!completed.length) {
    $("menuDialog").close();
    toast("Geen afgevinkte producten");
    return;
  }

  if (!confirm(
    `${completed.length} afgevinkte producten wissen?`
  )) return;

  for (const item of completed) {
    await del("shopping", item.id);
  }

  model.items = model.items.filter(i => !i.checked);

  $("menuDialog").close();
  render();
  toast("Afgevinkte producten gewist");
}

/* Delen */
function shareText() {
  return "Boodschappen\n\n" +
    model.items
      .filter(i => !i.checked)
      .map(i =>
        "○ " + i.name +
        (details(i) ? ` (${details(i)})` : "")
      )
      .join("\n");
}

async function share() {
  const text = shareText();
  $("menuDialog").close();

  try {
    if (navigator.share) {
      await navigator.share({
        title: "Boodschappen",
        text
      });
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
      toast("Lijst gekopieerd");
    } else {
      toast("Delen is niet beschikbaar");
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      toast("Delen mislukt");
    }
  }
}

/* Back-up */
async function backup() {
  try {
    const data = {};

    for (const store of Object.keys(STORES)) {
      data[store] = await getAll(store);
    }

    const backupData = {
      app: "tafel",
      version: 1,
      exportedAt: new Date().toISOString(),
      data
    };

    const blob = new Blob(
      [JSON.stringify(backupData, null, 2)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download =
      `tafel-backup-${new Date().toISOString().slice(0, 10)}.json`;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1500);

    $("menuDialog").close();
    toast("Back-up geëxporteerd");
  } catch (error) {
    console.error(error);
    toast("Back-up mislukt");
  }
}

/* Event listeners */
$("addForm").addEventListener("submit", async event => {
  event.preventDefault();

  const input = $("newItem");
  const text = input.value.trim();
  if (!text) return;

  input.disabled = true;

  try {
    await addItem(text);
    input.value = "";
  } catch (error) {
    console.error(error);
    toast("Toevoegen mislukt");
  } finally {
    input.disabled = false;

    if (!matchMedia("(pointer:coarse)").matches) {
      input.focus();
    }
  }
});

document.addEventListener("click", async event => {
  if (event.target.closest("#filterAddStore")) {
    showStoreDialog("filter");
    return;
  }

  const filter = event.target.closest("[data-filter]");

  if (filter) {
    model.filter = filter.dataset.filter;
    render();
    return;
  }

  const button = event.target.closest("[data-action]");

  if (button) {
    const id = button.closest("[data-id]")?.dataset.id;
    if (!id) return;

    try {
      if (button.dataset.action === "toggle") {
        await toggle(id);
      } else if (button.dataset.action === "edit") {
        edit(id);
      }
    } catch (error) {
      console.error(error);
      toast("Wijziging mislukt");
    }
  }
});

$("completedToggle").onclick = () => {
  model.completedOpen = !model.completedOpen;
  render();
};

$("editForm").onsubmit = event =>
  saveEdit(event).catch(error => {
    console.error(error);
    toast("Bewaren mislukt");
  });

$("cancelEdit").onclick = () => $("editDialog").close();

$("deleteItem").onclick = () =>
  deleteItem().catch(error => {
    console.error(error);
    toast("Verwijderen mislukt");
  });

$("addStoreFromEdit").onclick = () =>
  showStoreDialog("edit");

$("storeForm").onsubmit = createStore;

$("cancelStore").onclick = closeStoreDialog;

$("storeDialog").addEventListener("cancel", event => {
  if (storeOrigin === "edit") {
    event.preventDefault();
    closeStoreDialog();
  }
});

$("menuButton").onclick = () =>
  $("menuDialog").showModal();

$("closeMenu").onclick = () =>
  $("menuDialog").close();

$("menuAddStore").onclick = () =>
  showStoreDialog("menu");

$("clearCompleted").onclick = () =>
  clearCompleted().catch(error => {
    console.error(error);
    toast("Wissen mislukt");
  });

$("shareButton").onclick = share;
$("exportButton").onclick = backup;

/* App starten */
load().catch(error => {
  console.error(error);
  $("subtitle").textContent =
    "Kan boodschappen niet laden. Controleer de browseropslag.";
  toast("Probleem met lokale opslag");
});

/* Oude serviceworker verwijderen om caching te vermijden */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(registrations => {
      registrations.forEach(registration => {
        if (registration.active?.scriptURL.endsWith("/sw.js")) {
          registration.unregister();
        }
      });
    })
    .catch(console.error);
}
</script>
